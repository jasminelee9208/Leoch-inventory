<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leoch Inventory</title>

  <style>
    /* Basic page style */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 5px;
    }

    /* Header area */
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      height: 70px;
    }

    .header h2 {
      margin: 0;
      font-size: 32px;
    }

    /* Last updated text */
    #lastUpdated {
      color: #666;
      margin-bottom: 15px;
    }

    /* Search and dropdown area */
    .filters {
      margin-bottom: 15px;
    }

    input, select {
      padding: 5px;
      font-size: 14px;
      margin-right: 5px;
    }

    /* Table style */
    table {
      border-collapse: collapse;
      width: 80%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f2f2f2;
    }

    /* Hide rows when filtered out */
    tr.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Header with logo -->
  <div class="header">
    <img src="logo.png" alt="Leoch Logo" class="logo">
    <h2>Leoch Inventory</h2>
  </div>

  <!-- Last update date from GitHub -->
  <p id="lastUpdated"></p>

  <!-- Search box and location filter -->
  <div class="filters">
    <input
      type="text"
      id="search"
      placeholder="Search by part number..."
      onkeyup="applyFilters()"
    >

    <select id="locationFilter" onchange="applyFilters()">
      <option value="">All Locations</option>
    </select>
  </div>

  <!-- Inventory table -->
  <table id="inventoryTable">
    <thead>
      <tr>
        <th>Material</th>
        <th>Part Number</th>
        <th>Location</th>
        <th>Available Qty</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Excel reader library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <script>
    /* Store displayed locations for dropdown */
    const locations = new Set();

    /* Convert SAP location codes to website names */
    const locationMap = {
      "U001": "Lake Forest, CA",
      "U008": "CA AGED",
      "U009": "TX AGED",
      "U024": "Dallas, TX"
    };

    /* Only keep these SAP locations */
    const allowedLocations = new Set(["U001", "U008", "U009", "U024"]);

    /* Load one Excel file from GitHub */
    async function loadExcel(file) {
      const res = await fetch(file + "?v=" + Date.now());
      const data = await res.arrayBuffer();

      const workbook = XLSX.read(data);
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      return XLSX.utils.sheet_to_json(sheet);
    }

    /* Read inventory data, filter it, group it, and show it */
    async function loadInventory() {
      const files = ["N010.xlsx"];
      const grouped = {};

      for (const file of files) {
        const rows = await loadExcel(file);

        rows.forEach(row => {
          /* Get needed columns from SAP */
          const material = String(row["Material"] || "").trim();
          const part = String(row["Leoch Part Number"] || "").trim();
          const loc = String(row["Sto.Loction"] || "").trim();
          const qty = parseFloat(row["Qty.Avail"]);

          /* Keep only material codes starting with 10 or 11 */
          if (!material || (!material.startsWith("10") && !material.startsWith("11"))) {
            return;
          }

          /* Remove blank part numbers and part numbers starting with BRACKET */
          if (!part || part.toUpperCase().startsWith("BRACKET")) {
            return;
          }

          /* Keep only selected locations */
          if (!allowedLocations.has(loc)) {
            return;
          }

          /* Keep only rows with quantity greater than 0 */
          if (!Number.isFinite(qty) || qty <= 0) {
            return;
          }

          /* Group rows by material + location */
          const key = material + "|" + loc;

          if (!grouped[key]) {
            grouped[key] = {
              material: material,
              part: part,
              location: locationMap[loc] || loc,
              qty: 0
            };
          }

          /* Add quantity together for grouped rows */
          grouped[key].qty += qty;
        });
      }

      renderTable(grouped);
    }

    /* Get real file update date from GitHub commit history */
    async function setLastUpdatedFromGitHub() {
      const repo = "jasminelee9208/Leoch-inventory";
      const files = ["N010.xlsx"];

      let latestDate = null;

      for (const file of files) {
        const res = await fetch(
          `https://api.github.com/repos/${repo}/commits?path=${encodeURIComponent(file)}&page=1&per_page=1`
        );

        if (!res.ok) {
          console.error("GitHub API error for file:", file, res.status);
          continue;
        }

        const data = await res.json();

        if (Array.isArray(data) && data.length > 0) {
          const commitDate = new Date(data[0].commit.committer.date);

          if (!latestDate || commitDate > latestDate) {
            latestDate = commitDate;
          }
        }
      }

      const el = document.getElementById("lastUpdated");

      if (latestDate) {
        const formatted =
          String(latestDate.getMonth() + 1).padStart(2, "0") + "/" +
          String(latestDate.getDate()).padStart(2, "0") + "/" +
          latestDate.getFullYear();

        el.innerText = "Last updated: " + formatted;
      } else {
        el.innerText = "Last updated: unavailable";
      }
    }

    /* Show grouped inventory data in the table */
    function renderTable(grouped) {
      const tbody = document.querySelector("#inventoryTable tbody");
      tbody.innerHTML = "";
      locations.clear();

      Object.values(grouped)
        .sort((a, b) => a.part.localeCompare(b.part))
        .forEach(item => {
          locations.add(item.location);

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${item.material}</td>
            <td>${item.part}</td>
            <td>${item.location}</td>
            <td>${item.qty.toLocaleString()}</td>
          `;

          tbody.appendChild(tr);
        });

      populateLocationDropdown();
    }

    /* Fill the location dropdown based on shown data */
    function populateLocationDropdown() {
      const select = document.getElementById("locationFilter");
      select.innerHTML = `<option value="">All Locations</option>`;

      Array.from(locations)
        .sort()
        .forEach(loc => {
          const opt = document.createElement("option");
          opt.value = loc;
          opt.textContent = loc;
          select.appendChild(opt);
        });
    }

    /* Filter table by part number search and location dropdown */
    function applyFilters() {
      const search = document.getElementById("search").value.toUpperCase();
      const loc = document.getElementById("locationFilter").value;

      document.querySelectorAll("#inventoryTable tbody tr").forEach(row => {
        const part = row.cells[1].innerText.toUpperCase();
        const rowLoc = row.cells[2].innerText;

        const show =
          part.includes(search) &&
          (!loc || rowLoc === loc);

        row.classList.toggle("hidden", !show);
      });
    }

    /* Start page load */
    async function init() {
      await loadInventory();
      await setLastUpdatedFromGitHub();
    }

    init();
  </script>

</body>
</html>
